<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1E48;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#040d21;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDE68A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle / Rounded Box -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="12" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 6" opacity="0.8" />

  <!-- Pen Nib (Top Center) -->
  <path d="M256 95 L282 145 L256 162 L230 145 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2" />
  <circle cx="256" cy="128" r="6" fill="#0B1E48" />
  <line x1="256" y1="134" x2="256" y2="162" stroke="#0B1E48" stroke-width="3" />

  <!-- Open Book -->
  <path d="M256 195 C195 160 118 175 110 180 L110 330 C118 325 195 310 256 345 C317 310 394 325 402 330 L402 180 C394 175 317 160 256 195 Z" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="8" />
  <line x1="256" y1="195" x2="256" y2="345" stroke="#0B1E48" stroke-width="8" stroke-linecap="round" />

  <!-- Book Lines Left -->
  <line x1="140" y1="225" x2="230" y2="240" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round" />
  <line x1="140" y1="255" x2="230" y2="270" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round" />
  <line x1="140" y1="285" x2="210" y2="298" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round" />

  <!-- Book Lines Right -->
  <line x1="282" y1="240" x2="372" y2="225" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round" />
  <line x1="282" y1="270" x2="372" y2="255" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round" />
  <line x1="282" y1="298" x2="352" y2="285" stroke="#CBD5E1" stroke-width="5" stroke-linecap="round" />

  <!-- Brand Typography -->
  <text x="256" y="405" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" letter-spacing="4">PRISHA</text>
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="3">STATIONERY &amp; XEROX</text>
  <text x="256" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="16" fill="#F59E0B" letter-spacing="2">THARAD • ESTD 2024</text>
</svg>
